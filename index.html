<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Chess Mystery Cache</title>


<style>

/* ======================================================
   GENERAL
   ====================================================== */

html,
body{

    margin:0;

    padding:0;

    width:100%;

    min-height:100%;

}


body{

    background:#111;

    color:white;

    font-family:Arial,sans-serif;

    text-align:center;

}


/* ======================================================
   MODO NORMAL
   ====================================================== */

.container{

    max-width:800px;

    margin:auto;

    padding:20px;

}


.logo{

    width:250px;

    max-width:90%;

    margin-bottom:10px;

}


h1{

    margin-top:0;

    margin-bottom:20px;

}


#language-selector{

    margin-bottom:25px;

}


#language-selector button{

    margin:0 4px;

    padding:8px 16px;

    font-weight:bold;

    border:none;

    border-radius:8px;

    cursor:pointer;

}


.puzzle{

    display:block;

    background:#222;

    color:white;

    text-decoration:none;

    padding:15px;

    margin:12px 0;

    border-radius:10px;

    font-size:1.1rem;

}


.puzzle:hover{

    background:#333;

}


/* ======================================================
   DARK CACHE
   ====================================================== */

body.darkcache-mode{

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:#111;

}


body.darkcache-mode .container{

    width:100%;

    height:100vh;

    max-width:none;

    margin:0;

    padding:8px;

    box-sizing:border-box;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}


/* ======================================================
   OCULTAR LOGO
   ====================================================== */

body.darkcache-mode .logo{

    display:none;

}


/* ======================================================
   TÍTULO
   ====================================================== */

body.darkcache-mode h1{

    margin:

        0 0 8px 0;

    font-family:

        'Courier New',
        monospace;

    font-size:

        clamp(
            14px,
            4vw,
            22px
        );

    letter-spacing:1px;

}


/* ======================================================
   IDIOMAS
   ====================================================== */

body.darkcache-mode #language-selector{

    margin-bottom:8px;

}


body.darkcache-mode #language-selector button{

    margin:0 2px;

    padding:

        4px 7px;

    border-radius:3px;

    font-size:

        clamp(
            8px,
            2vw,
            11px
        );

}


/* ======================================================
   LISTA
   ====================================================== */

body.darkcache-mode #list{

    width:92%;

    max-width:420px;

    max-height:70vh;

    overflow-y:auto;

    box-sizing:border-box;

}


/* ======================================================
   PUZZLES
   ====================================================== */

body.darkcache-mode .puzzle{

    box-sizing:border-box;

    background:#222;

    border:

        2px solid #555;

    border-radius:4px;

    padding:

        8px 10px;

    margin:

        6px 0;

    font-family:

        'Courier New',
        monospace;

    font-size:

        clamp(
            10px,
            2.8vw,
            15px
        );

    font-weight:bold;

    color:#fff;

}


body.darkcache-mode .puzzle:active{

    background:#444;

    transform:scale(.98);

}


/* ======================================================
   MÓVIL
   ====================================================== */

@media(max-width:700px){

    body.darkcache-mode .container{

        padding:6px;

    }

}


/* ======================================================
   PANTALLA BAJA / HORIZONTAL
   ====================================================== */

@media(max-height:500px){

    body.darkcache-mode h1{

        margin-bottom:4px;

        font-size:14px;

    }


    body.darkcache-mode #language-selector{

        margin-bottom:4px;

    }


    body.darkcache-mode .puzzle{

        padding:5px 8px;

        margin:3px 0;

        font-size:10px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ==================================================
         LOGO
         ================================================== -->

    <img
        src="chess-mystery-logo.png"
        alt="Chess Mystery Cache"
        class="logo"
    >


    <!-- ==================================================
         TÍTULO
         ================================================== -->

    <h1>
        Chess Mystery
    </h1>


    <!-- ==================================================
         IDIOMAS
         ================================================== -->

    <div id="language-selector">

        <button onclick="setLanguage('ca')">
            CAT
        </button>

        <button onclick="setLanguage('es')">
            ESP
        </button>

        <button onclick="setLanguage('en')">
            ENG
        </button>

    </div>


    <!-- ==================================================
         PUZZLES
         ================================================== -->

    <div id="list">

        Cargando...

    </div>

</div>


<script>

/* ======================================================
   DARK CACHE MODE
   ====================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const darkCacheMode =
    params.get("darkcache") === "true";


if(darkCacheMode){

    document.body.classList.add(
        "darkcache-mode"
    );

}


/* ======================================================
   IDIOMA
   ====================================================== */

let language =
    localStorage.getItem("language");


if(!language){

    const browserLang =
        navigator.language.toLowerCase();


    if(browserLang.startsWith("ca")){

        language = "ca";

    }

    else if(browserLang.startsWith("en")){

        language = "en";

    }

    else{

        language = "es";

    }

}


/* ======================================================
   CAMBIAR IDIOMA
   ====================================================== */

function setLanguage(lang){

    localStorage.setItem(
        "language",
        lang
    );

    location.reload();

}


/* ======================================================
   CARGAR PUZZLES
   ====================================================== */

async function loadList(){

    const puzzles =
        await (

            await fetch(
                "puzzles/index.json"
            )

        ).json();


    const container =
        document.getElementById(
            "list"
        );


    container.innerHTML = "";


    puzzles.forEach(puzzle => {

        const link =
            document.createElement("a");


        link.className =
            "puzzle";


        /* ==============================================
           ENLACE NORMAL
           ============================================== */

        if(!darkCacheMode){

            link.href =
                `play.html?p=${puzzle.id}`;

        }


        /* ==============================================
           ENLACE DARK CACHE
           ============================================== */

        else{

            link.href =
                `play.html?p=${puzzle.id}&darkcache=true`;

        }


        link.textContent =
            puzzle.title[language];


        container.appendChild(
            link
        );

    });

}


/* ======================================================
   INICIAR
   ====================================================== */

loadList();

</script>


</body>

</html>
