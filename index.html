<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chess Mystery Cache</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.logo{
    width:250px;
    max-width:90%;
    margin-bottom:10px;
}

h1{
    margin-top:0;
    margin-bottom:20px;
}

#language-selector{
    margin-bottom:25px;
}

#language-selector button{
    margin:0 4px;
    padding:8px 16px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.puzzle{
    display:block;
    background:#222;
    color:white;
    text-decoration:none;
    padding:15px;
    margin:12px 0;
    border-radius:10px;
    font-size:1.1rem;
    transition:0.2s;
}

.puzzle:hover{
    background:#333;
}

</style>

</head>

<body>

<div class="container">

    <img
        src="chess-mystery-logo.png"
        alt="Chess Mystery Cache"
        class="logo"
    >

    <h1>Chess Mystery Cache</h1>

    <div id="language-selector">

        <button onclick="setLanguage('ca')">
            CAT
        </button>

        <button onclick="setLanguage('es')">
            ESP
        </button>

        <button onclick="setLanguage('en')">
            ENG
        </button>

    </div>

    <div id="list">
        Cargando...
    </div>

</div>

<script>

let language =
    localStorage.getItem("language");

if(!language){

    const browserLang =
        navigator.language.toLowerCase();

    if(browserLang.startsWith("ca")){

        language = "ca";

    }else if(browserLang.startsWith("en")){

        language = "en";

    }else{

        language = "es";
    }
}

function setLanguage(lang){

    localStorage.setItem(
        "language",
        lang
    );

    location.reload();
}

async function loadList(){

    const puzzles =
        await (
            await fetch(
                "puzzles/index.json"
            )
        ).json();

    const container =
        document.getElementById(
            "list"
        );

    container.innerHTML = "";

    puzzles.forEach(puzzle => {

        const link =
            document.createElement("a");

        link.className =
            "puzzle";

        link.href =
            `play.html?p=${puzzle.id}`;

        link.textContent =
            puzzle.title[language];

        container.appendChild(
            link
        );
    });
}

loadList();

</script>

</body>
</html>
