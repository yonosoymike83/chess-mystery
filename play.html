<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Chess Mystery Cache</title>


<!-- ==================================================
     CSS
     ================================================== -->

<link rel="stylesheet" href="style.css">


<!-- ==================================================
     CHESSBOARD ELEMENT
     ================================================== -->

<script
    type="module"
    src="https://unpkg.com/chessboard-element?module">
</script>


<!-- ==================================================
     CHESS.JS
     ================================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js">
</script>

</head>


<body>


<div class="container">


    <!-- ==================================================
         TÍTULO
         ================================================== -->

    <h1 id="title">
        Cargando...
    </h1>


    <!-- ==================================================
         BARRA SUPERIOR
         ================================================== -->

    <div id="top-bar">

        <button
            class="back-btn"
            id="backButton">

            ←

        </button>


        <button
            onclick="setLanguage('ca')">

            CAT

        </button>


        <button
            onclick="setLanguage('es')">

            ESP

        </button>


        <button
            onclick="setLanguage('en')">

            ENG

        </button>

    </div>


    <!-- ==================================================
         DESCRIPCIÓN
         ================================================== -->

    <p id="description"></p>


    <!-- ==================================================
         TABLERO
         ================================================== -->

    <chess-board
        id="board">
    </chess-board>


    <!-- ==================================================
         ESTADO
         ================================================== -->

    <div id="status"></div>


    <!-- ==================================================
         PUZZLE RESUELTO
         ================================================== -->

    <div
        id="success"
        class="hidden">

        <h2>
            ✅ Puzzle resuelto
        </h2>


        <div id="coordinates"></div>


        <button id="copyBtn">

            📋 Copiar coordenadas

        </button>

    </div>

</div>


<!-- ======================================================
     DARK CACHE MODE
     ====================================================== -->

<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const darkCacheMode =
    params.get("darkcache") === "true";


if(darkCacheMode){

    document.body.classList.add(
        "darkcache-mode"
    );

}


/* ======================================================
   BOTÓN VOLVER
   ====================================================== */

const backButton =
    document.getElementById(
        "backButton"
    );


backButton.addEventListener(

    "click",

    () => {

        if(darkCacheMode){

            window.location.href =
                "index.html?darkcache=true";

        }else{

            window.location.href =
                "index.html";

        }

    }

);

</script>


<!-- ==================================================
     APP
     ================================================== -->

<script src="app.js"></script>


</body>

</html>
