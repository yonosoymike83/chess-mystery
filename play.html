<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Chess Mystery Cache</title>


<link rel="stylesheet" href="style.css">


<script
    type="module"
    src="https://unpkg.com/chessboard-element?module">
</script>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js">
</script>


<style>

/* ======================================================
   MODO NORMAL
   ====================================================== */

body{

    margin:0;

}


/* ======================================================
   DARK CACHE
   ====================================================== */

body.darkcache-mode{

    width:100vw;

    height:100vh;

    margin:0;

    padding:0;

    overflow:hidden;

    background:#111;

}


body.darkcache-mode .container{

    width:100%;

    height:100vh;

    max-width:none;

    margin:0;

    padding:0;

    box-sizing:border-box;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

}


/* ======================================================
   TÍTULO
   ====================================================== */

body.darkcache-mode #title{

    margin:

        4px
        0
        3px
        0;

    padding:0;

    font-size:clamp(
        12px,
        3vw,
        20px
    );

    line-height:1.1;

}


/* ======================================================
   BARRA SUPERIOR
   ====================================================== */

body.darkcache-mode #top-bar{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:4px;

    margin:2px 0 4px 0;

}


body.darkcache-mode #top-bar button{

    padding:

        3px
        7px;

    font-size:

        clamp(
            8px,
            2vw,
            11px
        );

}


/* ======================================================
   DESCRIPCIÓN
   ====================================================== */

body.darkcache-mode #description{

    margin:

        2px
        8px
        5px
        8px;

    font-size:

        clamp(
            8px,
            2vw,
            12px
        );

    line-height:1.1;

    max-width:95%;

}


/* ======================================================
   TABLERO
   ====================================================== */

body.darkcache-mode chess-board{

    display:block;

    width:

        min(
            94vw,
            76vh
        );

    height:

        min(
            94vw,
            76vh
        );

    max-width:none;

    max-height:none;

    flex:none;

}


/* ======================================================
   ESTADO
   ====================================================== */

body.darkcache-mode #status{

    margin:

        4px
        0
        0
        0;

    font-size:

        clamp(
            8px,
            2vw,
            12px
        );

    line-height:1.1;

}


/* ======================================================
   PUZZLE RESUELTO
   ====================================================== */

body.darkcache-mode #success{

    margin-top:4px;

    padding:4px;

    font-size:10px;

}


body.darkcache-mode #success h2{

    font-size:12px;

    margin:2px;

}


body.darkcache-mode #copyBtn{

    padding:4px 8px;

    font-size:9px;

}


/* ======================================================
   MÓVIL
   ====================================================== */

@media(max-width:700px){

    body.darkcache-mode chess-board{

        width:

            min(
                94vw,
                72vh
            );

        height:

            min(
                94vw,
                72vh
            );

    }

}


/* ======================================================
   PANTALLA MUY PEQUEÑA
   ====================================================== */

@media(max-height:500px){

    body.darkcache-mode #title{

        display:none;

    }


    body.darkcache-mode #description{

        display:none;

    }


    body.darkcache-mode chess-board{

        width:

            min(
                94vw,
                88vh
            );

        height:

            min(
                94vw,
                88vh
            );

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ==================================================
         TÍTULO
         ================================================== -->

    <h1 id="title">
        Cargando...
    </h1>


    <!-- ==================================================
         BARRA SUPERIOR
         ================================================== -->

    <div id="top-bar">


        <button
            class="back-btn"
            id="backButton">

            ←

        </button>


        <button
            onclick="setLanguage('ca')">

            CAT

        </button>


        <button
            onclick="setLanguage('es')">

            ESP

        </button>


        <button
            onclick="setLanguage('en')">

            ENG

        </button>


    </div>


    <!-- ==================================================
         DESCRIPCIÓN
         ================================================== -->

    <p id="description"></p>


    <!-- ==================================================
         TABLERO
         ================================================== -->

    <chess-board
        id="board">
    </chess-board>


    <!-- ==================================================
         ESTADO
         ================================================== -->

    <div id="status"></div>


    <!-- ==================================================
         ÉXITO
         ================================================== -->

    <div
        id="success"
        class="hidden">


        <h2>
            ✅ Puzzle resuelto
        </h2>


        <div id="coordinates">
        </div>


        <button id="copyBtn">

            📋 Copiar coordenadas

        </button>


    </div>


</div>


<script>

/* ======================================================
   DETECTAR DARK CACHE
   ====================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const darkCacheMode =
    params.get("darkcache") === "true";


if(darkCacheMode){

    document.body.classList.add(
        "darkcache-mode"
    );

}


/* ======================================================
   BOTÓN ATRÁS
   ====================================================== */

const backButton =
    document.getElementById(
        "backButton"
    );


backButton.addEventListener(

    "click",

    () => {

        if(darkCacheMode){

            location.href =
                "index.html?darkcache=true";

        }else{

            location.href =
                "index.html";

        }

    }

);

</script>


<script src="app.js"></script>


</body>

</html>
